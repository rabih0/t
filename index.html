<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familienplaner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1c1917">
    <meta name="apple-mobile-web-app-title" content="Termine">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    <link rel="icon" sizes="192x192" href="icons/icon-192.png" type="image/png">
    <link rel="icon" sizes="512x512" href="icons/icon-512.png" type="image/png">
    <!-- Icons from Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="blob-container">
        <div class="blob blob-gold"></div>
        <div class="blob blob-rose"></div>
    </div>

    <main class="container">
        <header>
            <h1>Familienplaner</h1>
            <div id="datetime"></div>
        </header>

        <section id="next-appointment-section" class="next-appointment-card">
            <!-- Next appointment will be dynamically inserted here -->
            <p>Keine anstehenden Termine.</p>
        </section>

        <section class="input-form-section">
            <form id="appointment-form">
                <div class="form-row">
                    <input type="text" id="appointment-title" placeholder="Neuer Termin..." required autocomplete="off">
                </div>
                <div class="form-row">
                    <input type="date" id="appointment-date" required>
                    <input type="time" id="appointment-time" required>
                </div>
                <div class="form-row">
                    <select id="appointment-category" required>
                        <option value="default" disabled selected>Kategorie</option>
                        <option value="doctor">Arzt</option>
                        <option value="school">Schule</option>
                        <option value="work">Arbeit</option>
                        <option value="leisure">Freizeit</option>
                        <option value="other">Sonstiges</option>
                    </select>
                </div>
                <div class="form-row">
                    <textarea id="appointment-notes" placeholder="Optionale Notizen..."></textarea>
                </div>
                <div class="form-row member-row">
                    <select id="family-member-select" required>
                        <option value="" disabled selected>Person</option>
                        <!-- Family members will be dynamically inserted here -->
                    </select>
                    <button type="button" id="add-member-btn" class="icon-btn">+</button>
                </div>
                <button type="submit" class="add-btn">Termin hinzufügen</button>
            </form>
            <form id="add-member-form" class="hidden">
                <input type="text" id="new-member-name" placeholder="Name der Person">
                <button type="submit">Hinzufügen</button>
                <button type="button" id="cancel-add-member">Abbrechen</button>
            </form>
        </section>

        <section class="list-section">
            <div class="search-wrapper">
                <i class="bi bi-search"></i>
                <input type="text" id="search-input" placeholder="Termine suchen..." autocomplete="off">
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="upcoming">Anstehend</button>
                <button class="tab-btn" data-tab="work">Arbeit</button>
                <button class="tab-btn" data-tab="completed">Erledigt</button>
            </div>
            <ul id="upcoming-list" class="appointment-list">
                <!-- Upcoming appointments will be dynamically inserted here -->
            </ul>
            <ul id="work-list" class="appointment-list hidden">
                <!-- Work appointments will be dynamically inserted here -->
            </ul>
            <ul id="completed-list" class="appointment-list hidden">
                <!-- Completed appointments will be dynamically inserted here -->
            </ul>
        </section>
    </main>

    <div id="appointment-details-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="modal-close-btn" class="modal-close-btn">&times;</button>
            <div id="modal-body">
                <!-- Appointment details will be injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
