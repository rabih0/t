<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meine Termine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-180x180.png" sizes="180x180">
    <link rel="icon" type="image/png" href="icon-192x192.png" sizes="192x192">
    <link rel="icon" type="image/png" href="icon-512x512.png" sizes="512x512">
    <link rel="apple-touch-icon" href="icon-1024x1024.png" sizes="1024x1024">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>Meine Termine</h1>
            <button id="add-appointment-btn" class="add-btn"><img src="add.svg" alt="Add"></button>
        </header>
        <nav class="tab-bar">
            <button class="tab-btn active" data-tab="current">Aktuelle</button>
            <button class="tab-btn" data-tab="upcoming">Zukünftige</button>
            <button class="tab-btn" data-tab="previous">Vergangene</button>
        </nav>
        <main class="app-main">
            <ul id="appointment-list" class="appointment-list">
                <!-- Appointments will be rendered here -->
            </ul>
        </main>
        <div id="add-appointment-modal" class="modal">
            <div class="modal-content">
                <header class="modal-header">
                    <h2></h2>
                    <button id="close-modal-btn" class="close-btn"><img src="close.svg" alt="Close"></button>
                </header>
                <form id="add-appointment-form" class="modal-form">
                    <input type="text" id="appointment-title" placeholder="Titel des Termins" required>
                    <input type="date" id="appointment-date" required>
                    <input type="time" id="appointment-time" required>
                    <button type="submit" class="save-btn">Speichern</button>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
