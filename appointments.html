<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termine - Familienplaner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1c1917">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="blob-container">
        <div class="blob blob-gold"></div>
        <div class="blob blob-rose"></div>
    </div>

    <main class="container">
        <header>
            <button id="back-btn" class="back-btn">
                <i class="bi bi-arrow-left"></i>
            </button>
            <h1>Terminliste</h1>
        </header>

        <section class="list-section full-height">
            <div class="search-wrapper">
                <i class="bi bi-search"></i>
                <input type="text" id="search-input" placeholder="Termine suchen..." autocomplete="off">
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="upcoming">Anstehend</button>
                <button class="tab-btn" data-tab="work">Arbeit</button>
                <button class="tab-btn" data-tab="completed">Erledigt</button>
            </div>
            <ul id="upcoming-list" class="appointment-list">
                <!-- Upcoming appointments will be dynamically inserted here -->
            </ul>
            <ul id="work-list" class="appointment-list hidden">
                <!-- Work appointments will be dynamically inserted here -->
            </ul>
            <ul id="completed-list" class="appointment-list hidden">
                <!-- Completed appointments will be dynamically inserted here -->
            </ul>
        </section>
    </main>

    <div id="appointment-details-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="modal-close-btn" class="modal-close-btn"><img src="close.svg" alt="Close"></button>
            <div id="modal-body">
                <!-- Appointment details will be injected here -->
            </div>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script src="app.js"></script>
</body>
</html>
