<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1612;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c1612;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(139,117,93,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(139,117,93,0.1);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Glass container -->
  <rect x="64" y="64" width="384" height="384" rx="32" fill="url(#glass)" stroke="rgba(218,165,32,0.3)" stroke-width="2"/>
  
  <!-- Calendar icon -->
  <rect x="128" y="128" width="256" height="192" rx="16" fill="rgba(218,165,32,0.2)" stroke="rgba(218,165,32,0.8)" stroke-width="3"/>
  
  <!-- Calendar header -->
  <rect x="128" y="128" width="256" height="48" rx="16" fill="rgba(218,165,32,0.9)"/>
  
  <!-- Calendar rings -->
  <circle cx="176" cy="112" r="8" fill="none" stroke="rgba(218,165,32,0.9)" stroke-width="4"/>
  <circle cx="336" cy="112" r="8" fill="none" stroke="rgba(218,165,32,0.9)" stroke-width="4"/>
  
  <!-- Calendar grid -->
  <g fill="rgba(218,165,32,0.6)">
    <circle cx="168" cy="208" r="6"/>
    <circle cx="208" cy="208" r="6"/>
    <circle cx="248" cy="208" r="6"/>
    <circle cx="288" cy="208" r="6"/>
    <circle cx="328" cy="208" r="6"/>
    
    <circle cx="168" cy="248" r="6"/>
    <circle cx="208" cy="248" r="6"/>
    <circle cx="248" cy="248" r="8" fill="rgba(218,165,32,0.9)"/>
    <circle cx="288" cy="248" r="6"/>
    <circle cx="328" cy="248" r="6"/>
    
    <circle cx="168" cy="288" r="6"/>
    <circle cx="208" cy="288" r="6"/>
    <circle cx="248" cy="288" r="6"/>
    <circle cx="288" cy="288" r="6"/>
    <circle cx="328" cy="288" r="6"/>
  </g>
  
  <!-- Clock -->
  <circle cx="256" cy="380" r="32" fill="rgba(218,165,32,0.2)" stroke="rgba(218,165,32,0.8)" stroke-width="3"/>
  <line x1="256" y1="380" x2="256" y2="360" stroke="rgba(218,165,32,0.9)" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="380" x2="270" y2="370" stroke="rgba(218,165,32,0.9)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="256" cy="380" r="3" fill="rgba(218,165,32,0.9)"/>
</svg>